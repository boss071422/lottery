```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机抽奖页面</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,"Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#111827,#1f2937);
    color:#fff;
    min-height:100vh;
    padding:28px
}

.container{
    max-width:1100px;
    margin:auto
}

h1{
    text-align:center;
    margin:0 0 25px;
    font-size:32px
}

.grid{
    display:grid;
    grid-template-columns:1fr 1.25fr;
    gap:22px
}

.panel{
    background:#ffffff10;
    border:1px solid #ffffff20;
    border-radius:18px;
    padding:22px;
    box-shadow:0 12px 35px #0005;
    backdrop-filter:blur(8px)
}

h2{
    margin-top:0
}

.subtitle{
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:18px
}

/* 倒计时 */

.cooldown{
    text-align:center;
    font-size:14px;
    font-weight:bold;
    color:#facc15;
    margin:10px 0 15px;
    min-height:20px
}

.cooldown.ready{
    color:#4ade80
}

/* =========================
   欧式轮盘
========================= */

.number-result{
    min-height:350px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:10px 0 18px;
    position:relative;
}

.roulette-wrap{
    width:320px;
    height:320px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.roulette-wheel{
    width:300px;
    height:300px;
    border-radius:50%;
    position:relative;
    background:
        repeating-conic-gradient(
            from -2.432deg,
            #caa35a 0deg 2deg,
            #161616 2deg 12.432deg,
            #caa35a 12.432deg 14.432deg,
            #b91c1c 14.432deg 24.864deg
        );
    border:10px solid #d4af67;
    box-shadow:
        0 12px 30px #000b,
        inset 0 0 0 5px #5b431b,
        inset 0 0 35px #000;
    transition:transform 4s cubic-bezier(.12,.76,.13,1);
}

.roulette-wheel::before{
    content:"";
    position:absolute;
    inset:25px;
    border-radius:50%;
    border:2px solid #e5c477;
    box-shadow:inset 0 0 0 4px #111, inset 0 0 0 7px #d4af67;
}

.roulette-wheel::after{
    content:"";
    position:absolute;
    inset:68px;
    border-radius:50%;
    background:radial-gradient(circle,#e5c477 0 10%,#8b6b2f 11% 18%,#151515 19% 100%);
    border:4px solid #d4af67;
    box-shadow:0 3px 10px #000a;
}

.roulette-numbers{
    position:absolute;
    inset:13px;
    z-index:3;
    pointer-events:none;
}

.roulette-number{
    position:absolute;
    left:50%;
    top:50%;
    width:28px;
    height:28px;
    margin:-14px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:#fff;
    font-size:11px;
    font-weight:bold;
    text-shadow:0 1px 2px #000;
    transform:
        rotate(var(--angle))
        translateY(-125px)
        rotate(calc(-1 * var(--angle)));
}

.roulette-pointer{
    position:absolute;
    z-index:10;
    top:-4px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:10px solid transparent;
    border-right:10px solid transparent;
    border-top:24px solid #facc15;
    filter:drop-shadow(0 2px 3px #000);
}

.roulette-result{
    position:absolute;
    z-index:8;
    width:82px;
    height:82px;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#111;
    border:4px solid #facc15;
    box-shadow:0 4px 18px #000b;
    font-weight:bold;
}

.roulette-result .result-number{
    font-size:30px;
    line-height:30px;
}

.roulette-result .result-label{
    font-size:11px;
    color:#cbd5e1;
    margin-top:3px;
}

.roulette-wrap.spinning .roulette-wheel{
    filter:brightness(1.08);
}

.result-list{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
    margin-top:-5px;
    min-height:38px;
}

.result-chip{
    min-width:38px;
    height:32px;
    padding:0 9px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:bold;
    box-shadow:0 3px 8px #0006;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    background:#2563eb;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    font-size:15px
}

button:hover:not(:disabled){
    filter:brightness(1.15)
}

button.secondary{
    background:#475569
}

button:disabled{
    opacity:.45;
    cursor:not-allowed
}

.history{
    margin-top:18px;
    display:flex;
    gap:8px;
    flex-wrap:wrap
}

.history span{
    background:#334155;
    padding:7px 11px;
    border-radius:8px
}

/* 牌型 */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:18px 0;
    min-height:175px
}

.card{
    background:#fff;
    color:#111827;
    border-radius:12px;
    min-height:165px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 20px #0005;
    font-weight:bold
}

.card .rank{
    font-size:34px
}

.card .suit{
    font-size:42px
}

.red{
    color:#dc2626
}

.card-type{
    font-size:13px;
    color:#64748b;
    margin-top:5px
}

.notice{
    margin-top:15px;
    color:#cbd5e1;
    font-size:13px;
    line-height:1.6
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr
    }

    .cards{
        grid-template-columns:repeat(2,1fr)
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎲 随机抽奖控制台</h1>

<div class="grid">

<!-- =========================
     奖池一
========================= -->

<section class="panel">

<h2>🎡 奖池一：轮盘数字</h2>

<div class="subtitle">
欧式轮盘：0–36，共37个号码；每次抽取都会进行轮盘旋转动画。
</div>

<div class="cooldown ready" id="numberCooldown">
    ✓ 可以抽奖
</div>

<div class="number-result">
    <div class="roulette-wrap" id="rouletteWrap">
        <div class="roulette-pointer"></div>
        <div class="roulette-wheel" id="rouletteWheel">
            <div class="roulette-numbers" id="rouletteNumbers"></div>
        </div>
        <div class="roulette-result" id="rouletteResult">
            <div class="result-number">?</div>
            <div class="result-label">等待抽奖</div>
        </div>
    </div>
</div>

<div class="result-list" id="numberResults"></div>

<div class="buttons" id="numberButtons"></div>

<div class="history" id="numberHistory"></div>

<div class="notice">
    按钮“随机抽 1–5”表示连续进行对应次数的欧式轮盘抽取；
    每次结果都会显示在轮盘中央及下方结果栏。抽取后冷却1分钟。
</div>

</section>


<!-- =========================
     奖池二
========================= -->

<section class="panel">

<h2>🃏 奖池二：牌型卡片</h2>

<div class="subtitle">
奖池固定包含：两对×9、一对×4、顺子×4、三条×3、同花×2、葫芦×2。
每次随机抽取4张，不重复抽取同一张卡片；牌型卡片总数为24张。
</div>

<div class="cooldown ready" id="cardCooldown">
    ✓ 可以抽奖
</div>

<div class="cards" id="cards"></div>

<div class="buttons">

<button id="drawCardButton" onclick="drawCards()">
    随机抽取 4 张卡片
</button>

<button class="secondary" onclick="resetCards()">
    重置牌池
</button>

</div>

<div class="notice" id="cardNotice">
    当前牌池：24 张
</div>

</section>

</div>
</div>


<script>

/* =====================================================
   独立冷却时间
===================================================== */

const COOLDOWN_TIME = 60;

/* 奖池一冷却 */
let numberCooldown = 0;

/* 奖池二冷却 */
let cardCooldown = 0;


/* 每秒更新两个倒计时 */

setInterval(()=>{

    if(numberCooldown > 0){
        numberCooldown--;
    }

    if(cardCooldown > 0){
        cardCooldown--;
    }

    updateCooldowns();

},1000);


/* =====================================================
   倒计时显示
===================================================== */

function formatTime(seconds){

    const m =
        Math.floor(seconds / 60);

    const s =
        seconds % 60;

    return String(m).padStart(2,"0")
        + ":"
        + String(s).padStart(2,"0");
}


function updateCooldowns(){

    const numberBox =
        document.getElementById(
            "numberCooldown"
        );

    const cardBox =
        document.getElementById(
            "cardCooldown"
        );


    /* 奖池一 */

    if(numberCooldown > 0){

        numberBox.textContent =
            "⏳ 冷却倒计时：" +
            formatTime(numberCooldown);

        numberBox.classList.remove("ready");

    }else{

        numberBox.textContent =
            "✓ 可以抽奖";

        numberBox.classList.add("ready");
    }


    /* 奖池二 */

    if(cardCooldown > 0){

        cardBox.textContent =
            "⏳ 冷却倒计时：" +
            formatTime(cardCooldown);

        cardBox.classList.remove("ready");

    }else{

        cardBox.textContent =
            "✓ 可以抽奖";

        cardBox.classList.add("ready");
    }


    /* 更新奖池一按钮 */

    document
        .querySelectorAll("#numberButtons button")
        .forEach(button=>{
            button.disabled =
                numberCooldown > 0;
        });


    /* 更新奖池二抽取按钮 */

    document.getElementById(
        "drawCardButton"
    ).disabled =
        cardCooldown > 0;

}


/* =====================================================
   奖池一：轮盘
===================================================== */

const numberHistory=[];

const numberButtons =
    document.getElementById(
        "numberButtons"
    );


for(let n=1;n<=5;n++){

    const b =
        document.createElement("button");

    b.textContent =
        "随机抽 " + n;

    b.onclick = ()=>{

        if(numberCooldown > 0){
            return;
        }

        drawNumbers(n);

        /* 只锁定奖池一 */

        numberCooldown =
            COOLDOWN_TIME;

        updateCooldowns();
    };

    numberButtons.appendChild(b);
}


function randInt(min,max){

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) + min;
}


const rouletteRed =
    new Set([
        1,3,5,7,9,
        12,14,16,18,19,
        21,23,25,27,
        30,32,34,36
    ]);


function rouletteColor(n){

    if(n===0){

        return {
            bg:"#16a34a",
            label:"绿"
        };
    }

    return rouletteRed.has(n)

        ? {
            bg:"#dc2626",
            label:"红"
        }

        : {
            bg:"#111827",
            label:"黑"
        };
}


/* =====================================================
   欧式轮盘数字与动画
===================================================== */

const rouletteOrder = [
    0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,
    5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26
];

const rouletteNumbers = document.getElementById("rouletteNumbers");
const rouletteWheel = document.getElementById("rouletteWheel");
const rouletteWrap = document.getElementById("rouletteWrap");
const rouletteResult = document.getElementById("rouletteResult");
const numberResults = document.getElementById("numberResults");

let rouletteRotation = 0;

/* 创建37个欧洲轮盘号码 */
rouletteOrder.forEach((num,index)=>{
    const el = document.createElement("div");
    el.className = "roulette-number";
    const angle = index * (360 / 37);

    el.style.setProperty("--angle", angle + "deg");

    const c = rouletteColor(num);
    el.style.background = c.bg;
    el.textContent = num;

    rouletteNumbers.appendChild(el);
});

function setRouletteResult(num,label="最终结果"){
    const c = rouletteColor(num);

    rouletteResult.style.background = c.bg;
    rouletteResult.querySelector(".result-number").textContent = num;
    rouletteResult.querySelector(".result-label").textContent = label;
}

function spinRoulette(num, callback){

    const index = rouletteOrder.indexOf(num);
    const slotAngle = index * (360 / 37);

    /* 每次至少旋转5圈，再把目标号码送到顶部 */
    const extraTurns = 5 + randInt(0,2);
    const target =
        rouletteRotation + extraTurns * 360 - slotAngle;

    rouletteRotation = target;

    rouletteWrap.classList.add("spinning");
    rouletteWheel.style.transform = `rotate(${target}deg)`;

    setTimeout(()=>{
        setRouletteResult(num, "开奖结果");
        rouletteWrap.classList.remove("spinning");

        if(callback) callback();
    },4100);
}

function drawNumbers(count){

    if(numberCooldown > 0){
        return;
    }

    const results=[];

    for(let i=0;i<count;i++){
        results.push(randInt(0,36));
    }

    /* 动画期间立即锁定奖池一 */
    numberCooldown = COOLDOWN_TIME;
    updateCooldowns();

    numberResults.innerHTML = "";

    let index = 0;

    function nextSpin(){

        if(index >= results.length){

            results.slice().reverse().forEach(v=>{
                numberHistory.unshift(v);
            });

            updateNumberHistory();
            return;
        }

        const value = results[index];

        setRouletteResult(value, `第 ${index+1} 次`);

        spinRoulette(value, ()=>{

            const c = rouletteColor(value);

            const chip = document.createElement("div");
            chip.className = "result-chip";
            chip.style.background = c.bg;
            chip.textContent = value;

            numberResults.appendChild(chip);

            index++;

            setTimeout(nextSpin,250);
        });
    }

    nextSpin();
}

function updateNumberHistory(){

    document.getElementById("numberHistory").innerHTML =
        numberHistory.slice(0,20).map(x=>{
            const c = rouletteColor(x);

            return `
                <span style="background:${c.bg};color:#fff">
                    ${x}
                </span>
            `;
        }).join("");
}


/* =====================================================
   奖池二：牌型池
===================================================== */

let pool=[];


function makePool(){

    pool=[];

    const types=[
        ["两对",9],
        ["一对",4],
        ["顺子",4],
        ["三条",3],
        ["同花",2],
        ["葫芦",2]
    ];

    types.forEach(([type,count])=>{

        for(let i=1;i<=count;i++){

            pool.push({
                type,
                id:type+i
            });
        }
    });
}


/* =====================================================
   奖池二抽取
===================================================== */

function drawCards(){

    if(cardCooldown > 0){
        return;
    }

    const selected=[];

    /*
       从当前16张牌型卡片中抽4张，
       同一次不会重复同一张卡片。
    */

    for(let i=0;i<4;i++){

        const index =
            randInt(
                0,
                pool.length-1
            );

        selected.push(
            pool[index]
        );

        pool.splice(index,1);
    }


    renderCards(selected);

    updateNotice();


    /* 只锁定奖池二 */

    cardCooldown =
        COOLDOWN_TIME;

    updateCooldowns();
}


/* =====================================================
   显示牌型卡片
===================================================== */

function renderCards(items){

    const box =
        document.getElementById(
            "cards"
        );

    box.innerHTML="";


    if(!items.length){

        box.innerHTML =
            `
            <div class="card">
                <div class="rank">?</div>
                <div class="suit">🃏</div>
                <div class="card-type">
                    等待抽取
                </div>
            </div>
            `.repeat(4);

        return;
    }


    items.forEach((x,i)=>{

        const c =
            document.createElement("div");

        c.className="card";

        c.innerHTML=`
            <div class="rank">
                ${i+1}
            </div>

            <div class="suit">
                🃏
            </div>

            <div class="card-type">
                ${x.type}
            </div>
        `;

        box.appendChild(c);
    });
}


/* =====================================================
   重置牌池
===================================================== */

function resetCards(){

    makePool();

    renderCards([]);

    updateNotice();
}


function updateNotice(){

    const count =
        pool.length;

    document.getElementById(
        "cardNotice"
    ).textContent =

        `当前牌池：${count} 张；` +
        `两对9张、一对4张、顺子4张、` +
        `三条3张、同花2张、葫芦2张`;
}


/* =====================================================
   初始化
===================================================== */

makePool();

renderCards([]);

updateNotice();

updateCooldowns();

</script>

</body>
</html>
```
